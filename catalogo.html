<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="Sfoglia i cataloghi delle linee Magrini: foto, peso e pezzatura di ogni prodotto.">

(function(){ var d=document.documentElement, t=null, l=null; try{ t=localStorage.getItem('mg-theme'); localStorage.removeItem('mg-lang'); l=sessionStorage.getItem('mg-lang'); }catch(e){} d.setAttribute('data-theme', t==='light' ? 'light' : 'dark');
  if(l!=='en'&&l!=='fr'&&l!=='es') l='it'; d.setAttribute('data-lang',l); d.lang=l; })();
</script>
<style>
/* font ospitati sul sito (nessuna richiesta a server esterni) */
@font-face{font-family:"Figtree";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"DM Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dm-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/dm-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Young Serif";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/young-serif-latin-400-normal.woff2) format("woff2")}
:root{
  --bg:#FFFCF2; --bg-alt:#FFF4C4; --surface:#FFFFFF; --paper:#FFFFFF; --crema:#FFF4BD; --crema-2:#FDE9A0;
  --giallo:#FCC80B; --arancio:#F2A20C; --blu:#2447A0; --blu-soft:#E6ECFA; --ink:#1A2240; --muted:#586080; --line:#EADFBF;
  --verde:#2FB35A; --rosso:#E41E26; --on-blu:#FFFFFF; --focus:#2447A0;
  --shadow:0 1px 0 rgba(26,34,64,.05), 0 10px 30px -14px rgba(26,34,64,.22);
  --book-shadow:0 30px 60px -30px rgba(26,34,64,.45), 0 2px 0 rgba(26,34,64,.06);
  --f-display:"Young Serif", Georgia, serif; --f-body:"Figtree","Segoe UI",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0E1430; --bg-alt:#121A3C; --surface:#172047; --paper:#F7F3E6; --crema:#1D285A; --crema-2:#25326B;
    --blu:#A3B7FF; --blu-soft:#1D2858; --ink:#F3F0E2; --muted:#AEB5D2; --line:#29346A; --on-blu:#0E1430; --focus:#FCC80B;
    --shadow:0 12px 30px -14px rgba(0,0,0,.65); --book-shadow:0 30px 70px -30px rgba(0,0,0,.9); }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0E1430; --bg-alt:#121A3C; --surface:#172047; --paper:#F7F3E6; --crema:#1D285A; --crema-2:#25326B;
  --blu:#A3B7FF; --blu-soft:#1D2858; --ink:#F3F0E2; --muted:#AEB5D2; --line:#29346A; --on-blu:#0E1430; --focus:#FCC80B;
  --shadow:0 12px 30px -14px rgba(0,0,0,.65); --book-shadow:0 30px 70px -30px rgba(0,0,0,.9); }

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--blu)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-inline:clamp(16px,3.5vw,40px)}
.mono{font-family:var(--f-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:70px}
.top .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-right:auto}
.top .brand img{height:46px;width:auto}
:root[data-theme="dark"] .top .brand img{background:#FFF8D6;border-radius:8px;padding:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top .brand img{background:#FFF8D6;border-radius:8px;padding:3px}}
.top .brand span{font:400 1.05rem var(--f-display)}
.back{font-weight:600;font-size:.95rem;text-decoration:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink)}
.back:hover{border-color:var(--blu);color:var(--blu)}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:500 .76rem/1 var(--f-mono);letter-spacing:.05em;border:0;background:transparent;color:var(--muted);padding:7px 8px;border-radius:999px;cursor:pointer}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.back{white-space:nowrap}
@media (max-width:560px){.back{padding:8px 12px}.back span{display:none}.lang button{padding:7px 6px}}
.theme-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.theme-btn svg{width:19px;height:19px}
.i-sun{display:none}
:root[data-theme="dark"] .i-sun{display:block} :root[data-theme="dark"] .i-moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .i-sun{display:block}:root:not([data-theme="light"]) .i-moon{display:none}}
@media (max-width:560px){.top .brand span{display:none}}

/* intestazione catalogo */
.head{padding-block:clamp(28px,4vw,52px) 18px}
.head .wrap{display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.eyebrow{font:500 .78rem/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--giallo)}
.head h1{font-size:clamp(2.2rem,1.4rem + 3vw,3.8rem);color:var(--blu);margin-top:10px}
.head p{color:var(--muted);margin-top:6px}
.lines{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.lines button{font:500 .92rem/1 var(--f-body);padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lines button[aria-pressed="true"]{background:var(--blu);border-color:var(--blu);color:var(--on-blu)}

/* barra strumenti */
.tools{position:sticky;top:calc(71px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.search{flex:1 1 240px;max-width:380px;position:relative}
.search input{width:100%;font:inherit;font-size:.96rem;padding:11px 14px 11px 40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--blu)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:.94rem;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:#2FB35A}
.count{font:500 .85rem var(--f-mono);color:var(--muted)}
.views{margin-left:auto;display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.views button{font:600 .88rem/1 var(--f-body);border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ====== BOOK ====== */
.stage{padding-block:clamp(22px,3vw,40px) 30px}
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:10px;box-shadow:var(--book-shadow);height:clamp(460px,calc(100vh - 330px),700px);perspective:1800px;color:#1A2240}
.book::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:44px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(26,34,64,.10) 45%,rgba(26,34,64,.18) 50%,rgba(26,34,64,.10) 55%,rgba(0,0,0,0) 100%);pointer-events:none;z-index:2}
.leaf{position:relative;display:flex;flex-direction:column;padding:clamp(22px,3vw,48px);min-width:0;min-height:0}
.leaf.left{border-radius:10px 0 0 10px;background:#fff;align-items:center;justify-content:center}
.leaf.right{border-radius:0 10px 10px 0;background:#FFFDF6;justify-content:center;gap:18px}
.leaf.left img{width:100%;height:100%;object-fit:contain}
.leaf.left.cover{padding:18px;background:#FFF4BD}
.leaf.left.cover img{width:auto;height:100%;max-width:100%;border-radius:14px;box-shadow:0 10px 24px -12px rgba(26,34,64,.4)}
.folio{position:absolute;bottom:16px;font:500 .78rem var(--f-mono);color:#8A8FA6;letter-spacing:.06em}
.leaf.left .folio{left:22px} .leaf.right .folio{right:22px}
.runhead{position:absolute;top:18px;left:clamp(22px,3vw,48px);right:clamp(22px,3vw,48px);display:flex;justify-content:space-between;font:500 .74rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#8A8FA6}
.pname{font:400 clamp(1.9rem,1.2rem + 2.4vw,3.2rem)/1.05 var(--f-display);color:#2447A0}
.pdesc{font-size:clamp(1.02rem,.95rem + .3vw,1.2rem);color:#40486A;max-width:40ch}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:440px;margin:4px 0 0}
.spec{border-top:3px solid #FCC80B;padding-top:10px}
.spec dt{font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#8A8FA6}
.spec dd{margin:4px 0 0;font:400 1.5rem/1.1 var(--f-display);color:#1A2240}
.badge-sg{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font:600 .82rem/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:#1B6B37;background:#E3F5E9;border:1.5px solid #9AD8AE;padding:8px 12px;border-radius:999px}
.badge-sg::before{content:"";width:9px;height:9px;border-radius:50%;background:#2FB35A}
.leaf.left.multi{justify-content:flex-start;gap:12px;padding-bottom:40px}
.leaf.left.multi .main{flex:1;min-height:0}
.ph-thumbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ph-thumbs button{width:62px;height:48px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#f3f0e6;cursor:pointer}
.ph-thumbs button[aria-pressed="true"]{border-color:#F2A20C}
.ph-thumbs img{width:100%;height:100%;object-fit:cover}
.formati{margin-top:6px;max-width:440px}
.formati h3{font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#8A8FA6;margin-bottom:8px}
.formati ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.formati li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #EFE6C9;font-size:.98rem;color:#1A2240}
.formati li b{font:500 .95rem var(--f-mono)}
.nota{font-size:1rem;color:#40486A;border-left:3px solid #FCC80B;padding-left:12px;max-width:440px}
.formati .chips{display:flex;flex-wrap:wrap;gap:8px}
.formati .chips li{display:inline-block;padding:6px 12px;border:1px solid #EFE6C9;border-radius:999px;background:#FFFBEF;font-size:.9rem;color:#1A2240}
.cover-title .logo{width:150px;margin-bottom:6px}
.cover-title h2{font-size:clamp(2.2rem,1.4rem + 3vw,3.8rem);color:#2447A0}
.cover-title p{color:#40486A;max-width:38ch}
.cover-title .tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;width:160px;height:8px}
.cover-title .tri span:nth-child(1){background:#2FB35A}.cover-title .tri span:nth-child(2){background:#fff;box-shadow:inset 0 0 0 1px #E1DCC8}.cover-title .tri span:nth-child(3){background:#E41E26}
.start{align-self:flex-start;display:inline-flex;gap:10px;align-items:center;background:#2447A0;color:#fff;border:0;border-radius:999px;padding:13px 20px;font:600 1rem var(--f-body);cursor:pointer}
.cover-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.dl-dep{display:inline-flex;gap:8px;align-items:center;border:2px solid #2447A0;color:#2447A0;border-radius:999px;padding:11px 18px;font:600 1rem var(--f-body);text-decoration:none}
.dl-dep:hover{background:#2447A0;color:#fff}


/* carta dei gusti */
.leaf.right.gusti{justify-content:flex-start;padding-top:56px;overflow:auto}
.glist{list-style:none;margin:0;padding:0;columns:4 130px;column-gap:16px;font-size:.88rem;color:#1A2240}
.glist li{break-inside:avoid;padding:3px 0 3px 16px;position:relative;line-height:1.35}
.glist li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:#D9D2B5}
.glist b{font:600 .62rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;background:#E41E26;color:#fff;padding:2px 5px;border-radius:4px;vertical-align:2px}

/* animazione girata pagina */
@keyframes turnNextR{0%{transform:rotateY(0);opacity:1}100%{transform:rotateY(-18deg);opacity:0}}
@keyframes inNext{0%{transform:translateX(26px) rotateY(10deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes inPrev{0%{transform:translateX(-26px) rotateY(-10deg);opacity:0}100%{transform:none;opacity:1}}
.book.next .leaf{animation:inNext .5s var(--ease) both;transform-origin:left center}
.book.next .leaf.left{animation-delay:.04s}
.book.prev .leaf{animation:inPrev .5s var(--ease) both;transform-origin:right center}
.book.prev .leaf.right{animation-delay:.04s}

.navbar{display:flex;align-items:center;gap:14px;margin-top:18px}
.navbtn{width:52px;height:52px;flex-shrink:0;border-radius:50%;border:0;background:var(--blu);color:var(--on-blu);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.navbtn:hover{transform:scale(1.06)}
.navbtn:disabled{opacity:.35;cursor:default;transform:none}
.navbtn svg{width:22px;height:22px}
.slider{flex:1;display:grid;gap:4px}
.slider input{width:100%;accent-color:#F2A20C}
.slider .lbl{display:flex;justify-content:space-between;font:500 .8rem var(--f-mono);color:var(--muted)}
.hint{font:500 .78rem var(--f-mono);color:var(--muted);text-align:center;margin-top:10px}

/* strip miniature */
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:thin}
.strip button{flex:0 0 64px;height:64px;border-radius:10px;border:2px solid transparent;background:#fff;padding:4px;cursor:pointer}
.strip button img{width:100%;height:100%;object-fit:contain}
.strip button[aria-current="true"]{border-color:#F2A20C}

@media (max-width:860px){
  .book{grid-template-columns:1fr;height:auto}
  .book::before{display:none}
  .leaf.left{border-radius:10px 10px 0 0;height:46vh;padding:18px}
  .leaf.left.cover{height:62vh}
  .tools{position:static}
  .leaf.left{height:38vh}
  .navbar{position:sticky;bottom:0;z-index:5;background:var(--bg);padding-block:10px;margin-top:8px}
  .leaf.right{border-radius:0 0 10px 10px;padding-top:44px;padding-bottom:48px}
  .book.next .leaf,.book.prev .leaf{transform-origin:center}
}

/* ====== GRIGLIA ====== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-block:clamp(22px,3vw,40px) 40px}
.gcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;transition:transform .3s var(--ease)}
.gcard:hover{transform:translateY(-4px)}
.gcard .ph{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.gcard .ph img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain}
.gcard .tx{padding:12px 14px 14px;display:grid;gap:6px}
.gcard h3{font-size:1.06rem;line-height:1.2}
.gcard .meta{font:500 .82rem var(--f-mono);color:var(--muted)}
.gcard .sg{justify-self:start;font:600 .7rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.04em;color:#1B6B37;background:#E3F5E9;padding:5px 8px;border-radius:999px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

footer{border-top:1px solid var(--line);padding-block:26px 34px;color:var(--muted);font-size:.88rem}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo-magrini.svg" alt="Raffaele Magrini" width="64" height="46"><span data-t="brand">Cataloghi Magrini</span></a>
    <a class="back" href="index.html#gamma">&larr;<span data-t="back"> Torna al sito</span></a>
    <div class="lang" role="group" aria-label="Lingua / Language">
      <button type="button" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Tema chiaro o scuro">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<section class="head">
  <div class="wrap">
    <div>
      <span class="eyebrow" id="h-eyebrow">Catalogo 2026</span>
      <h1 id="h-title">Linea Impulso</h1>
      <p id="h-sub"></p>
    </div>
    <div class="lines" id="lines" role="group" aria-label="Linee"></div>
  </div>
</section>

<div class="tools">
  <div class="wrap">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cerca un prodotto..." aria-label="Cerca un prodotto" data-t-ph="search"></label>
    <label class="chk"><input type="checkbox" id="sg"> <span data-t="onlySg">Solo senza glutine</span></label>
    <span class="count" id="count"></span>
    <div class="views" role="group" aria-label="Vista">
      <button type="button" data-view="book" aria-pressed="true" data-t="vBook">Sfoglia</button>

        count:function(n){ return n+(n===1?' producto':' productos'); }}
  };
  /* titoli delle linee tradotti come nella home; le altre restano col nome del marchio */
  var LT = {
    sorbetteria:{en:'Sorbets & Semifreddi',fr:'Sorbets & Semifreddi',es:'Sorbetes y Semifríos'},
    giochi:{en:'Games & Gelato',fr:'Jeux et Glaces',es:'Juegos y Helados'},

    mantecato:{en:'Our Mantecato',fr:'Notre Mantecato',es:'Nuestro Mantecato'}

  var PH = {
    'Disponibile in gusti assortiti':{en:'Available in assorted flavours',fr:'Disponible en parfums assortis',es:'Disponible en sabores variados'},

    'Composta da strati di':{en:'Made of layers of',fr:'Composée de couches de',es:'Compuesta por capas de'}
  };
  /* unita' di misura nelle pezzature */
  var UN = {
    en:[[/\bpz\b/g,'pcs'],[/\bconf\./g,'packs'],[/\bastucci\b/g,'boxes'],[/\bda\b/g,'of'],[/\bcad\./g,'each'],[/\bo\b/g,'or']],
    fr:[[/\bpz\b/g,'pcs'],[/\bconf\./g,'paquets'],[/\bastucci\b/g,'étuis'],[/\bda\b/g,'de'],[/\bcad\./g,'pièce'],[/\bo\b/g,'ou']],
    es:[[/\bpz\b/g,'uds.'],[/\bconf\./g,'paquetes'],[/\bastucci\b/g,'estuches'],[/\bda\b/g,'de'],[/\bcad\./g,'c/u'],[/\bo\b/g,'o']]
  };
  var LANGS = ['it','en','fr','es'];
  var lang = document.documentElement.getAttribute('data-lang'); if (LANGS.indexOf(lang) < 0) lang = 'it';
  function t(k){ return (T[lang] && T[lang][k] != null) ? T[lang][k] : T.it[k]; }
  function lineTitle(id){ return (lang !== 'it' && LT[id] && LT[id][lang]) || DATA[id].titolo; }
  function phr(s){ return (lang !== 'it' && PH[s] && PH[s][lang]) || s; }
  function un(s){ s = String(s || ''); if (lang === 'it') return s; (UN[lang] || []).forEach(function(r){ s = s.replace(r[0], r[1]); }); return s; }
  var ids = Object.keys(DATA);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur = ids[0], list = [], page = 0;
  var $ = function(id){ return document.getElementById(id); };
  function tn(u){ return /\.webp$/.test(u || '') ? u.replace(/\.webp$/, '-t.webp') : u; }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* linee */
  $('lines').innerHTML = ids.map(function(id){ return '<button type="button" data-id="'+id+'" aria-pressed="'+(id===cur)+'">'+esc(lineTitle(id))+'</button>'; }).join('');
  $('lines').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; cur = b.dataset.id; $('lines').querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); }); page = 0; $('q').value=''; $('sg').checked=false; try { history.replaceState(null,'','#'+cur); } catch(e){} refresh(); });

  function filtered(){
    var q = $('q').value.trim().toLowerCase(), sg = $('sg').checked;
    return DATA[cur].prodotti.filter(function(p){ return (!sg || p.sg) && (!q || (p.nome + ' ' + (p.gusti || []).join(' ')).toLowerCase().indexOf(q) >= 0); });
  }
  function filtering(){ return $('q').value.trim() !== '' || $('sg').checked; }

  /* pagina del book: 0 = copertina (se non si filtra), poi i prodotti */
  function hasGusti(){ return !filtering() && DATA[cur].gusti && DATA[cur].gusti.length; }
  function pages(){ return filtering() ? list.length : list.length + 1 + (hasGusti() ? 1 : 0); }
  function isGustiPage(i){ return hasGusti() && i === list.length + 1; }
  function prodAt(i){ return filtering() ? list[i] : (i === 0 || isGustiPage(i) ? null : list[i-1]); }
  function nFormati(L){ return L.prodotti.reduce(function(n,p){ return n + 1 + (p.formati ? p.formati.length : 0); }, 0); }
  function introText(L){ return L.gusti ? t('introMant')(nFormati(L), L.gusti.length) : t('intro')(L.prodotti.length); }
  function gustiHtml(L){
    return '<div class="leaf left"><img src="'+esc(L.gustiFoto || L.copertina)+'" alt="'+esc(t('vetrina'))+'"></div>' +
      '<div class="leaf right gusti"><div class="runhead"><span>'+esc(lineTitle(cur))+' '+esc(L.anno)+'</span><span>'+esc(t('carta'))+'</span></div>' +
      '<h2 class="pname">'+esc(t('cartaTitle'))+'</h2>' +
      '<p class="pdesc">'+esc(t('cartaDesc')(Math.ceil(L.gusti.length/10)*10))+'</p>' +
      '<ul class="glist">' + L.gusti.map(function(g){ return '<li>'+esc(g.nome)+(g.novita ? ' <b>'+esc(t('novita'))+'</b>' : '')+'</li>'; }).join('') + '</ul></div>';
  }

  function renderBook(dir){
    var L = DATA[cur], n = pages(), book = $('book');
    if (!n) { book.innerHTML = '<div class="leaf right" style="grid-column:1/-1"><p class="empty">'+esc(t('none'))+'</p></div>'; }
    else {
      page = Math.max(0, Math.min(page, n - 1));
      var p = prodAt(page), html;
      if (isGustiPage(page)) {
        html = gustiHtml(L);
      } else if (!p) {
        html = '<div class="leaf left cover"><img src="'+esc(L.copertina)+'" alt="'+esc(lineTitle(cur))+' '+esc(L.anno)+'"></div>' +
               '<div class="leaf right cover-title"><img class="logo" src="img/logo-magrini.svg" alt="Raffaele Magrini"><span class="eyebrow">'+esc(t('catalog'))+' '+esc(L.anno)+'</span><h2>'+esc(lineTitle(cur))+'</h2>' +
               '<div class="tri" aria-hidden="true"><span></span><span></span><span></span></div>' +
               '<p>'+introText(L)+'</p>' +
               '<div class="cover-actions"><button class="start" type="button" id="start">'+t('start')+'</button>' +
               (L.depliant ? '<a class="dl-dep" href="'+esc(L.depliant)+'" download><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+esc(cur === 'mantecato' ? t('depMant') : t('dep'))+'</a>' : '') + '</div></div>';
      } else {
        var num = filtering() ? page + 1 : page;
        var ph = p.foto && p.foto.length ? [p.img].concat(p.foto) : null;
        html = '<div class="leaf left'+(ph ? ' multi' : '')+'"><img class="main" src="'+esc(p.img)+'" alt="'+esc(p.nome)+'">' +
               (ph ? '<div class="ph-thumbs">' + ph.map(function(u,k){ return '<button type="button" data-src="'+esc(u)+'" aria-pressed="'+(k===0)+'" aria-label="'+esc(t('photo'))+' '+(k+1)+'"><img src="'+esc(tn(u))+'" alt=""></button>'; }).join('') + '</div>' : '') +
               '<span class="folio">'+String(num*2).padStart(2,'0')+'</span></div>' +
               '<div class="leaf right"><div class="runhead"><span>'+esc(lineTitle(cur))+' '+esc(L.anno)+'</span><span>'+num+' / '+list.length+'</span></div>' +
               '<h2 class="pname">'+esc(p.nome)+'</h2>' +
               '<dl class="specs">'+(p.peso ? '<div class="spec"><dt>'+esc(t('weight'))+'</dt><dd>'+esc(un(p.peso))+'</dd></div>' : '')+(p.pz ? '<div class="spec"><dt>'+esc(t('pz'))+'</dt><dd>'+esc(un(p.pz))+'</dd></div>' : '')+'</dl>' +
               (p.sg ? '<span class="badge-sg">'+esc(t('sg'))+'</span>' : '') +
               (p.nota ? '<p class="nota">'+esc(phr(p.nota))+'</p>' : '') +
               (p.formati && p.formati.length ? '<div class="formati"><h3>'+esc(t('formats'))+'</h3><ul>' + p.formati.map(function(f){ return '<li><span>'+esc(f.nome)+'</span><b>'+esc(f.peso)+'</b></li>'; }).join('') + '</ul></div>' : '') +
               (p.gusti && p.gusti.length ? '<div class="formati gusti-p"><h3>'+esc(p.gustiTitolo ? phr(p.gustiTitolo) : t('flav'))+'</h3><ul class="chips">' + p.gusti.map(function(g){ return '<li>'+esc(g)+'</li>'; }).join('') + '</ul></div>' : '') +
               '<span class="folio">'+String(num*2+1).padStart(2,'0')+'</span></div>';
      }
      book.innerHTML = html;
      book.querySelectorAll('.ph-thumbs button').forEach(function(bt){ bt.addEventListener('click', function(){ book.querySelector('.leaf.left .main').src = bt.dataset.src; book.querySelectorAll('.ph-thumbs button').forEach(function(x){ x.setAttribute('aria-pressed', String(x===bt)); }); }); });
      var st = $('start'); if (st) st.addEventListener('click', function(){ go(1); });
    }
    book.classList.remove('next','prev');
    if (dir && !reduce) { void book.offsetWidth; book.classList.add(dir); }
    $('prev').disabled = page <= 0; $('next').disabled = page >= n - 1;

    $('pgname').textContent = p2 ? p2.nome : '';
    $('strip').querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-current', String(+b.dataset.i === page)); });
    var a = $('strip').querySelector('[aria-current="true"]'), sp = $('strip'); if (a) sp.scrollTo({left: a.offsetLeft - sp.clientWidth/2 + a.clientWidth/2, behavior: reduce ? 'auto' : 'smooth'});
  }
  function renderStrip(){
    var off = filtering() ? 0 : 1;
    $('strip').innerHTML = list.map(function(p,i){ return '<button type="button" data-i="'+(i+off)+'" title="'+esc(p.nome)+'"><img src="'+esc(tn(p.img))+'" alt="" loading="lazy"></button>'; }).join('');
  }
  $('strip').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) { var t = +b.dataset.i; go(t, t > page ? 'next' : 'prev'); } });

  function renderGrid(){
    var off = filtering() ? 0 : 1;
    $('grid').innerHTML = list.length ? list.map(function(p,i){
      return '<button type="button" class="gcard" data-i="'+(i+off)+'"><div class="ph"><img src="'+esc(tn(p.img))+'" alt="'+esc(p.nome)+'" loading="lazy"></div><div class="tx"><h3>'+esc(p.nome)+'</h3><span class="meta">'+[p.peso, p.pz].filter(Boolean).map(function(x){ return esc(un(x)); }).join(' · ')+'</span>'+(p.sg ? '<span class="sg">'+esc(t('sg'))+'</span>' : '')+'</div></button>';
    }).join('') : '<p class="empty">'+esc(t('none'))+'</p>';
  }
  $('grid').addEventListener('click', function(e){ var b = e.target.closest('.gcard'); if (!b) return; page = +b.dataset.i; setView('book'); renderBook('next'); window.scrollTo({top:0, behavior: reduce ? 'auto':'smooth'}); });

  function go(to, dir){ var n = pages(); if (to < 0 || to >= n || to === page) return; dir = dir || (to > page ? 'next' : 'prev'); page = to; renderBook(dir); }
  $('prev').addEventListener('click', function(){ go(page - 1, 'prev'); });
  $('next').addEventListener('click', function(){ go(page + 1, 'next'); });
  $('range').addEventListener('input', function(){ go(+this.value); });
  document.addEventListener('keydown', function(e){
    if ($('v-book').hidden || /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== 'range') return;
    if (e.key === 'ArrowRight') { go(page + 1, 'next'); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(page - 1, 'prev'); e.preventDefault(); }
  });
  var x0 = null;
  $('book').addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  $('book').addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(page + (dx < 0 ? 1 : -1)); x0 = null; });

  function setView(v){
    document.querySelectorAll('.views button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.view === v)); });
    $('v-book').hidden = v !== 'book'; $('v-grid').hidden = v !== 'grid';
  }
  document.querySelectorAll('.views button').forEach(function(b){ b.addEventListener('click', function(){ setView(b.dataset.view); }); });

  function refresh(){
    var L = DATA[cur];
    list = filtered();
    $('h-title').textContent = lineTitle(cur); $('h-eyebrow').textContent = t('catalog') + ' ' + L.anno;
    $('h-sub').textContent = introText(L);
    $('count').textContent = t('count')(list.length);
    renderStrip(); renderGrid(); renderBook();
  }
  $('q').addEventListener('input', function(){ page = 0; refresh(); });
  $('sg').addEventListener('change', function(){ page = 0; refresh(); });

  /* tema */
  $('theme-btn').addEventListener('click', function(){
    var r = document.documentElement, t = r.getAttribute('data-theme');
    var dark = t ? t === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var nx = dark ? 'light' : 'dark'; r.setAttribute('data-theme', nx); try { localStorage.setItem('mg-theme', nx); } catch(e){}
  });

  /* apertura diretta: catalogo.html#impulso */
  var h = (location.hash || '').replace('#','');
  if (DATA[h]) { cur = h; $('lines').querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.id === h)); }); }
  /* lingua */
  function applyLang(l){
    lang = l; document.documentElement.lang = l; document.documentElement.setAttribute('data-lang', l);
    document.querySelectorAll('[data-t]').forEach(function(el){ el.innerHTML = t(el.dataset.t); });
    document.querySelectorAll('[data-t-ph]').forEach(function(el){ el.placeholder = t(el.dataset.tPh); el.setAttribute('aria-label', t(el.dataset.tPh).replace(/\.+$/,'')); });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    $('theme-btn').setAttribute('aria-label', t('theme')); $('prev').setAttribute('aria-label', t('prev')); $('next').setAttribute('aria-label', t('next'));
    $('range').setAttribute('aria-label', t('goto')); $('strip').setAttribute('aria-label', t('thumbs')); $('lines').setAttribute('aria-label', t('lines'));
    document.title = t('title');
    document.querySelector('.back').setAttribute('aria-label', t('back').trim());
    $('lines').querySelectorAll('button').forEach(function(b){ b.textContent = lineTitle(b.dataset.id); });
  }
  document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.dataset.lang); try { sessionStorage.setItem('mg-lang', b.dataset.lang); } catch(e){} if (ids.length) refresh(); }); });
  applyLang(lang);
  if (!ids.length) { $('book').innerHTML = '<p class="empty">'+esc(t('na'))+'</p>'; return; }
  refresh();
})();
</script>
